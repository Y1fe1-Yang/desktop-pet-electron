<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Pet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: no-drag;
      cursor: default;
    }

    /* Pet container */
    #pet-container {
      position: absolute;
      width: 128px;
      height: 128px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 9999;
    }

    /* Canvas for sprite rendering */
    #pet-canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    /* Interaction area (slightly larger than visible pet for easier clicking) */
    #pet-container::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <!-- Pet container with canvas for sprite rendering -->
  <div id="pet-container">
    <canvas id="pet-canvas" width="128" height="128"></canvas>
  </div>

  <!-- Load renderer script -->
  <script src="renderer.js"></script>
</body>
</html>
